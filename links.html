<!DOCTYPE html>
<!-- Chapter 4: Links-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Links Example</title>
    </head>
    <body>
        <!--Linking to other websites-->
        <h1>Linking to other websites</h1>
        <p> Movie Reviews:
            <ul>
                <li><a href="https://www.empireonline.com">Empire Online</a></li>
                <li><a href="https://www.metacritic.com">Metacritic</a></li>
                <li><a href="https://www.rottentomatoes.come">Rotten Tomatoes</a></li>
                <li><a href="https://www.variety.com">Variety</a></li>
            </ul>
        </p>

        <!--Linking to other pages within the same website (relative URLs E.G. Index.html)-->
        <p>
            <h1>Linking to other pages within the same website</h1>
            <ul>
                <li><a href="lists.html">Lists Page</a></li>
                <li><a href="first-test.html">First Test Page</a></li>
            </ul>
        </p>

        <h1>Email Links</h1>
        <p>
            <!-- Email link (mailto:)-->
            <a href="mailto:example@example.com">Send Email to example@example.com</a>
        </p>

        <h1>Opening Links in a New Tab</h1>
        <p>
            <!-- Opening a link in a new tab -->
            <a href="https://www.imdb.com" target="_blank">Opens IMDb in a new tab</a>
        </p>
        

       

    </body>
</html>
